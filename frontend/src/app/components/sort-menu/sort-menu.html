<button mat-icon-button class="sort-toggle" type="button" aria-label="Sıralama seçeneklerini aç" (click)="open.update(value => !value)"><mat-icon>swap_vert</mat-icon></button>
@if (open()) {
  <section class="sort-panel" aria-label="Sıralama seçenekleri">
    <header><strong>Sırala</strong><button mat-icon-button type="button" aria-label="Sıralama seçeneklerini kapat" (click)="open.set(false)"><mat-icon>close</mat-icon></button></header>
    <div class="sort-options">
      @for (option of options; track option.value) {
        <button type="button" [class.selected]="option.value === value" (click)="select(option.value)"><span>{{ option.label }}</span>@if (option.value === value) { <mat-icon>check</mat-icon> }</button>
      }
    </div>
  </section>
}
